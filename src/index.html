<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diatone Library</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='8' width='24' height='16' rx='2' fill='none' stroke='%230f766e' stroke-width='1.8'/%3E%3Cline x1='8' y1='10' x2='8' y2='22' stroke='%230f766e' stroke-width='1'/%3E%3Cline x1='12' y1='10' x2='12' y2='22' stroke='%230f766e' stroke-width='1'/%3E%3Cline x1='16' y1='10' x2='16' y2='22' stroke='%230f766e' stroke-width='1'/%3E%3Cline x1='20' y1='10' x2='20' y2='22' stroke='%230f766e' stroke-width='1'/%3E%3Cline x1='24' y1='10' x2='24' y2='22' stroke='%230f766e' stroke-width='1'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">
                <svg width="48" height="48" viewBox="0 0 32 32">
                    <rect x="4" y="8" width="24" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="8" y1="10" x2="8" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="12" y1="10" x2="12" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="16" y1="10" x2="16" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="20" y1="10" x2="20" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="24" y1="10" x2="24" y2="22" stroke="currentColor" stroke-width="1"/>
                </svg>
                <span>Diatonic Library</span>
            </div>
            <span class="login-beta">Beta-Phase</span>
            <div class="login-password-wrap">
                <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password">
                <button type="button" id="login-show-pw" title="Passwort anzeigen" tabindex="-1">👁</button>
            </div>
            <div id="login-error" class="login-error"></div>
            <button id="login-btn">Anmelden</button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header id="header">
            <div id="logo" class="logo">
                <svg width="32" height="32" viewBox="0 0 32 32" style="margin-right: 12px;">
                    <rect x="4" y="8" width="24" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
                    <line x1="8" y1="10" x2="8" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="12" y1="10" x2="12" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="16" y1="10" x2="16" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="20" y1="10" x2="20" y2="22" stroke="currentColor" stroke-width="1"/>
                    <line x1="24" y1="10" x2="24" y2="22" stroke="currentColor" stroke-width="1"/>
                </svg>
                <span>Diatonic<br>Library</span>
            </div>

            <div id="song-selector">
                <select id="category-dropdown">
                    <option value="" disabled selected></option>
                </select>
                <select id="songs-dropdown" disabled>
                    <option value="" disabled selected></option>
                </select>
            </div>

            <div id="playback-controls" class="button-group">
                <button id="play-btn">▶</button>
                <button id="pause-btn" style="display: none;">⏸</button>
                <button id="stop-btn" style="display: none;">⏹</button>
            </div>

            <div class="spacer"></div>

            <div id="zoom-controls" class="button-group zoom-buttons">
                <button id="zoom-out-btn">🔍−</button>
                <button id="zoom-in-btn">🔍+</button>
            </div>

            <button id="fullscreen-btn" class="menu-button" title="Fullscreen">⛶</button>
            <button id="menu-btn" class="menu-button">☰</button>
        </header>

        <div id="menu-overlay" class="menu-overlay" style="display: none;"></div>

        <nav id="hamburger-menu" class="menu hamburger-menu" style="display: none;">
            <div class="menu-content">
                <div class="hamburger-icon-row">
                    <button type="button" id="hamburger-language-btn" class="menu-icon-btn" title="Language" aria-label="Language"></button>
                    <button type="button" id="hamburger-theme-btn" class="menu-icon-btn" title="Theme" aria-label="Theme"></button>
                    <button type="button" id="hamburger-notes-btn" class="menu-icon-btn" title="Notes" aria-label="Notes"></button>
                    <button type="button" id="hamburger-hard-reload-btn" class="menu-icon-btn" title="Hard reload" aria-label="Hard reload"></button>
                    <button type="button" id="hamburger-help-btn" class="menu-icon-btn" aria-label="Help" title="Help"></button>
                </div>

                <div class="menu-divider"></div>

                <div class="hamburger-rating-header">
                    <h3 id="hamburger-rating-heading"></h3>
                    <div class="hamburger-rating-actions">
                        <button id="hamburger-youtube-btn" class="menu-icon-btn menu-square-btn"></button>
                        <button id="hamburger-inventory-btn" class="menu-icon-btn menu-square-btn"></button>
                    </div>
                </div>

                <div class="rating-section">
                    <div id="hamburger-rating-stars" class="rating-stars"></div>
                </div>

                <div class="play-count-section">
                    <p id="hamburger-play-count"></p>
                </div>

                <div class="menu-divider"></div>
            </div>
        </nav>

        <main id="main-content">
            <div class="welcome-container" id="welcome-view">
                <h1></h1>
                <p></p>
            </div>
            <div id="tablature-view" class="tablature-view" style="display: none;">
                <div id="tablature-container" class="tablature-container"></div>
            </div>
            <div id="inventory-view" class="inventory-view" style="display: none;">
                <div class="inventory-controls">
                    <button id="filter-all" class="active"></button>
                    <button id="filter-rated"></button>
                    <button id="filter-mostplayed"></button>
                </div>
                <div id="inventory-container" class="inventory-container"></div>
            </div>
            <div id="help-view" class="help-view" style="display: none;">
                <div class="help-header">
                    <button id="help-back-btn" class="menu-item"></button>
                </div>
                <div id="help-container" class="help-container"></div>
            </div>
        </main>
    </div>

    <!-- Auth (muss als erstes geladen werden) -->
    <script src="js/core/auth.js"></script>

    <!-- Core Basis-Module (keine Abhängigkeiten) -->
    <script src="js/core/loader.js"></script>
    <script src="js/core/data.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/metrics.js"></script>
    <script src="js/core/i18n.js"></script>

    <!-- State Management (hängt von data ab) -->
    <script src="js/core/state.js"></script>

    <!-- UI Base (hängt von state und data ab) -->
    <script src="js/ui/ui.js"></script>

    <!-- UI Controls (hängt von state und ui ab) -->
    <script src="js/ui/controls.js"></script>
    <script src="js/ui/inventory.js"></script>
    <script src="js/ui/menus.js"></script>
    <script src="js/ui/help.js"></script>

    <!-- Playback (hängt von audio, state, ui ab) -->
    <script src="js/playback.js"></script>

    <!-- Navigation (hängt von state, playback, ui, data ab) -->
    <script src="js/ui/navigation.js"></script>

    <!-- Events & Init (hängt von allen anderen ab) -->
    <script src="js/events.js"></script>
</body>
</html>
